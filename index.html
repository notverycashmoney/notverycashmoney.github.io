function monthKey(d){ return d.slice(0,7); }
Views.history=function(){ const p=S.pref(); const today=todayStr();
  const wk=App._histWeek||weekKeyOf(today); const mk=App._histMonth||monthKey(today);
  let html='<div class="card" data-swipe="hist-week-swipe"><div class="card-h"><div><span class="micro">Week of '+esc(fmtDate(wk))+'</span>'
    +'<div class="small dimmer">'+(wk===weekKeyOf(today)?'this week':esc(fmtDate(wk,'full')+' – '+fmtDate(addDays(wk,6))))+'</div></div>'
    +'<div style="display:flex;gap:6px"><button class="iconbtn" data-act="hist-week" data-d="-1">'+icon('chevl',16)+'</button><button class="iconbtn" data-act="hist-week" data-d="1" '+(wk>=weekKeyOf(today)?'disabled':'')+'>'+icon('chevr',16)+'</button></div></div>'
    +'<div class="weekstrip">';
  for(let i=0;i<7;i++){ const d=addDays(wk,i); const r=dayRecords(d); const dt=s2d(d); const n=r.lifts.length+r.cardio.length; const fut=d>today;
    html+='<button class="wday'+(d===today?' today':'')+(fut?' fut':'')+'" data-act="open-day" data-d="'+d+'"><span class="wd-dow">'+DOW[dt.getDay()]+'</span><span class="wd-n">'+dt.getDate()+'</span>'+dayDots(r)
      +'<span class="wd-sub">'+(n? (r.lifts.length? esc(r.lifts[0].name.split(' ')[0]) : esc((r.cardio[0].name||'Cardio').split(' ')[0])) : (fut?'':'—'))+'</span></button>'; }
  html+='</div></div>';
  /* month grid */
  const [Y,M]=mk.split('-').map(Number); const first=Y+'-'+String(M).padStart(2,'0')+'-01'; const gridStart=weekStart(first,p.weekStart);
  const label=MONTHS[M-1]+' '+Y; const nextMk=monthKey(addDays(first,35)); const prevMk=monthKey(addDays(first,-1));
  const dows=[]; for(let i=0;i<7;i++) dows.push(DOW[(p.weekStart+i)%7]);
  let cnt=0; let sessM=0; doneSessions().forEach(s=>{ if(monthKey(s.date)===mk) sessM++; });
  html+='<div class="card" data-swipe="hist-month-swipe"><div class="card-h"><div><span class="micro">'+label+'</span><div class="small dimmer">'+sessM+' session'+(sessM===1?'':'s')+'</div></div>'
    +'<div style="display:flex;gap:6px"><button class="iconbtn" data-act="hist-month" data-m="'+prevMk+'">'+icon('chevl',16)+'</button><button class="iconbtn" data-act="hist-month" data-m="'+nextMk+'" '+(mk>=monthKey(today)?'disabled':'')+'>'+icon('chevr',16)+'</button></div></div>'
    +'<div class="mgrid mgrid-h">'+dows.map(x=>'<span class="micro" style="text-align:center">'+x.slice(0,2)+'</span>').join('')+'</div><div class="mgrid">';
  for(let i=0;i<42;i++){ const d=addDays(gridStart,i); if(i>=35&&monthKey(d)!==mk) break; const inM=monthKey(d)===mk; const dt=s2d(d);
    if(!inM){ html+='<span class="mday off"></span>'; continue; } const r=dayRecords(d); const fut=d>today;
    html+='<button class="mday'+(d===today?' today':'')+(fut?' fut':'')+(r.lifts.length||r.cardio.length?' has':'')+'" data-act="open-day" data-d="'+d+'"><span class="md-n">'+dt.getDate()+'</span>'+dayDots(r)+'</button>'; }
  html+='</div><div class="legend"><span class="li"><span class="sw" style="background:var(--acc-mark)"></span>lift</span><span class="li"><span class="sw" style="background:var(--c2)"></span>cardio</span><span class="li"><span class="sw" style="background:var(--ink3)"></span>body log</span></div></div>';
  html+='<div class="small dimmer center">Tap any day to see, edit or add records, including past days. Swipe or use the arrows to move.</div>';
  return html; };

    +'<div class="mt8 mb14"><div class="micro brass">'+esc(MG[ex.mg]||'')+(ex.mg2&&ex.mg2.length?' · '+ex.mg2.map(m=>MG[m]).join(' · '):'')+'</div><h1 class="h1">'+esc(ex.name)+'</h1>'
    +'<div class="chiprow mt8"><button class="chip" data-act="ex-savetpl" data-id="'+id+'">'+icon('savetpl',14)+' Save to template</button><button class="chip" data-act="rest-settings">'+icon('restedit',14)+' Rest '+fmtRest(ex.rest||defRest())+'</button></div></div>';
  if(stall&&stall.stalled) html+='<div class="banner warn">'+icon('warn')+'<div><b>Plateau flag.</b> e1RM flat across the last 6 sessions. Consider a back-off week, a rep-range change, or a variation swap.</div></div>';
  html+='<div class="statgrid"><div class="stat"><div class="micro">Best e1RM</div><div class="v">'+(best.e1?fmtW(best.e1,p.unit,false):'—')+'<span class="small dim"> '+p.unit+'</span></div><div class="d">'+(best.e1At? fmtDate(best.e1At):'')+'</div></div>'
    +'<div class="stat"><div class="micro">Heaviest set</div><div class="v">'+(best.maxW?fmtW(best.maxW,p.unit,false):'—')+'<span class="small dim"> '+p.unit+'</span></div><div class="d">any reps</div></div>'
    +'<div class="stat"><div class="micro">Sessions</div><div class="v">'+best.history.length+'</div><div class="d">all time</div></div>'
    +'<div class="stat"><div class="micro">Best set volume</div><div class="v">'+(best.vol?fmtShort(lbTo(best.vol,p.unit)):'—')+'</div><div class="d">'+p.unit+' in one set</div></div></div>';
  html+='<div class="card"><div class="card-h"><span class="micro">e1RM trend · '+esc(FORMULAS[p.formula].name)+'</span><button class="linkbtn" data-act="ex-table" data-id="'+id+'">Data</button></div>'
    +lineChart({series:[{name:'e1RM',points:best.history.map(h=>({d:h.date,v:round(lbTo(h.e1,p.unit),1)}))}],yFmt:v=>round(v,0)+''})+'</div>';
  const reps=Object.keys(best.reps).map(Number).sort((a,b)=>a-b);
  html+='<div class="card"><div class="card-h"><span class="micro">Rep-max ledger</span><span class="micro dimmer">best × reps</span></div>'
    +(reps.length? '<div class="wrap">'+reps.map(r=>'<div class="chip" style="padding:8px 13px"><b class="num" style="color:var(--ink)">'+fmtW(best.reps[r].w,p.unit,false)+'</b><span class="dimmer">×'+r+'</span></div>').join('')+'</div>' : '<div class="chart-empty">No working sets yet.</div>')+'</div>';
  return html; };

App._volOff=0; App._exSel=null;
function defaultExSel(){ if(App._exSel&&S.get(App._exSel)) return App._exSel;
  for(const c of ['ex_squat','ex_bench','ex_deadlift','ex_ohp']){ if(bestsFor(c).history.length) return c; }
  let top=null,ton=0; S.all('ex').forEach(e=>{ const t=sum(bestsFor(e.id).history.map(h=>h.ton)); if(t>ton){ ton=t; top=e.id; } }); return top||'ex_squat'; }
Views.analytics=function(){ const p=S.pref(); const wk=addDays(weekKeyOf(todayStr()),App._volOff*7); const wkEnd=addDays(wk,6);
  const vol=hardSetsByMuscle(wk,wkEnd); const totalHard=round(sum(Object.values(vol)),1); const bwt=bwTrend(); const lbw=latestBw(); const bfs=bfSeries();
  const exSel=defaultExSel(); const bestSel=bestsFor(exSel); const q=quotaState();
  let html='<div class="statgrid"><div class="stat"><div class="micro">Streak</div><div class="v">'+streakDays()+'<span class="small dim">d</span></div><div class="d">consecutive active days</div></div>'
    +'<div class="stat"><div class="micro">This week</div><div class="v">'+(q.lift.done+q.cardio.done)+'<span class="small dim">/'+(q.lift.goal+q.cardio.goal)+'</span></div><div class="d">'+q.lift.done+' lift'+(q.lift.done===1?'':'s')+' · '+q.cardio.done+' cardio</div></div>'
    +'<div class="stat"><div class="micro">Week tonnage</div><div class="v">'+fmtShort(lbTo(weeklyTonnage(1)[0].v,p.unit))+'</div><div class="d">'+p.unit+' lifted</div></div>'
    +'<div class="stat"><div class="micro">Bodyweight</div><div class="v">'+(lbw?fmtW(lbw.v,p.unit,false):'—')+'</div><div class="d">'+(bwt? (Math.abs(bwt.weekDelta)<0.1?'steady trend':(bwt.weekDelta>0?'+':'')+round(lbTo(bwt.weekDelta,p.unit),1)+' '+p.unit+'/wk trend'):'log often for a trend')+'</div></div></div>';
  html+='<div class="card"><div class="card-h"><div><span class="micro">Hard sets per muscle</span><div class="small dimmer">'+esc(fmtDate(wk))+' – '+esc(fmtDate(wkEnd))+' · '+totalHard+' total</div></div>'
    +'<div style="display:flex;gap:6px"><button class="iconbtn" data-act="vol-nav" data-d="-1">'+icon('chevl',16)+'</button><button class="iconbtn" data-act="vol-nav" data-d="1" '+(App._volOff>=0?'disabled':'')+'>'+icon('chevr',16)+'</button></div></div>'
    +muscleBarList(vol,p.landmarks)+'<div class="tablebtn"><button class="linkbtn" data-act="vol-table">View as table</button></div></div>';
  const tw=weeklyTonnage(8);
  html+='<div class="card"><div class="card-h"><span class="micro">Weekly tonnage · 8 weeks</span><button class="linkbtn" data-act="ton-table">Data</button></div>'
    +barsChart({points:tw.map(w=>({label:fmtDate(w.week),sub:'week of '+fmtDate(w.week,'full'),v:round(lbTo(w.v,p.unit))})),yFmt:fmtShort})+'</div>';
  html+='<div class="card"><div class="card-h"><div><span class="micro">Strength · e1RM</span><div class="small dimmer">'+esc(FORMULAS[p.formula].name)+' formula</div></div><button class="btn small" data-act="pick-exsel">'+esc(exName(exSel))+' ▾</button></div>'
    +lineChart({series:[{name:'e1RM',points:bestSel.history.map(h=>({d:h.date,v:round(lbTo(h.e1,p.unit),1)}))}],yFmt:v=>round(v,0)+''})
    +'<div class="tablebtn"><button class="linkbtn" data-act="open-ex" data-id="'+exSel+'">Full history & rep-max ledger →</button></div></div>';
  const bwPts=bwSeries().map(x=>({d:x.d,v:round(lbTo(x.v,p.unit),1)})); const emaPts=emaSeries(bwSeries()).map(x=>({d:x.d,v:round(lbTo(x.v,p.unit),1)}));
  html+='<div class="card"><div class="card-h"><div><span class="micro">Body composition</span><div class="small dimmer">'+(p.bfGoal? 'goal: '+p.bfGoal+'% body-fat':'trend over daily readings')+'</div></div>'
    +'<div style="display:flex;gap:6px"><button class="btn small" data-act="log-bw">Weigh-in</button><button class="btn small ghost" data-act="log-bf">BF%</button></div></div>'
    +lineChart({series:[{name:'trend',points:emaPts},{name:'daily',points:bwPts,dots:true,noLabel:true}],yFmt:v=>round(v,1)+''});
  if(bfs.length) html+='<div class="divider"></div><div class="micro mb8">Body-fat log</div><div class="wrap">'+bfs.slice(-8).reverse().map(b=>'<span class="chip"><b style="color:var(--ink)">'+b.pct+'%</b>&nbsp;'+esc((b.method||'').toUpperCase())+' · '+fmtDate(b.date)+'</span>').join('')+'</div>';
  html+='</div><div class="card"><div class="card-h"><span class="micro">Consistency · 16 weeks</span></div>'+calendarHeat(16)+'</div>';
  return html; };

function openGuide(){ const p=S.pref(); const on=p.guideOnOpen!==0;
  const row=(n,t,s)=>'<div class="rowline" style="align-items:flex-start;padding-left:0;padding-right:0"><span class="guide-num">'+n+'</span><div class="rl-main"><div class="rl-t">'+t+'</div><div class="rl-s">'+s+'</div></div></div>';
  openSheet('<div class="sheet-h"><div><div class="micro brass">Field manual</div><span class="h2">Welcome to the Ledger'+(p.name?', '+esc(p.name):'')+'</span></div><button class="iconbtn" data-act="close-sheet" aria-label="close">'+icon('x')+'</button></div>'
    +'<p class="dim" style="margin:0 0 6px">One file, zero accounts, no connection needed. Every set lives on this device and in the backups you keep. Six things to know:</p>'
    +'<div class="card flush" style="background:none;border:0">'
    +row(1,'Templates rotate, days don’t','Your split is a sequence of templates, and Train shows what’s up next. Skip days freely; the order holds. Tap the big title to start any template instead, or tap a rotation card to jump. Rings track your weekly targets.')
    +row(2,'Logging is two taps','Grey ghost numbers are last time’s sets. Tap ✓ to log them as-is, or type over them. The rest timer starts itself and survives a locked phone. Tap a set’s number tag for warm-up, top set, drop, myo-reps and more. Tap the rest time under any exercise to change it.')

    +row(5,'Read trends, not noise','Analyze charts e1RM per lift, weekly hard sets against your MEV–MRV bands, and the bodyweight <i>trend</i> over daily scatter. Plateau flags fire after six flat sessions.')
    +row(6,'Your data is a file','System → <b>Export the Ledger</b> writes one HTML file holding the app <i>and</i> your entire history. Open it on any device, then merge or replace. Add the Ledger to your home screen and log from that icon.')

      +'<div class="formgrid tplgrid mt8" style="grid-template-columns:1fr 1fr 1fr 1fr"><div><label class="micro">Sets</label><input class="input num" style="min-height:42px" type="number" data-set="tplb" data-i="'+i+'" data-k="sets" value="'+b.sets+'"></div>'
      +'<div><label class="micro">Reps</label><input class="input" style="min-height:42px" data-set="tplb" data-i="'+i+'" data-k="reps" value="'+esc(b.reps||'')+'"></div>'
      +'<div><label class="micro">RPE</label><input class="input num" style="min-height:42px" type="number" step="0.5" data-set="tplb" data-i="'+i+'" data-k="rpe" value="'+(b.rpe||'')+'"></div>'
      +'<div><label class="micro">Rest s</label><input class="input num" style="min-height:42px" type="number" data-set="tplb" data-i="'+i+'" data-k="rest" value="'+restFor(b)+'"></div></div>'
      +'<div class="wrap mt8"><button class="linkbtn" data-act="tpl-core" data-i="'+i+'">'+(b.core?'✓ Core (kept in short sessions)':'Mark as core')+'</button><button class="linkbtn dimmer" data-act="tpl-abs" data-i="'+i+'">'+(b.abs?'✓ Finisher group':'Mark as finisher')+'</button></div></div>').join('')+'</div>'

Inputs['tplb']=t=>{ const tpl=S.get(App._tplId); const b=tpl.blocks[+t.dataset.i]; if(!b) return; const k=t.dataset.k; const v= k==='reps'? t.value.trim() : parseFloat(t.value);
  if(k==='sets') b.sets=clamp(parseInt(t.value,10)||1,1,12); else if(k==='reps') b.reps=v||'8-12'; else if(k==='rpe') b.rpe=(v>0?clamp(v,5,10):null); else if(k==='rest') b.rest=clamp(parseInt(t.value,10)||90,15,600); tplSave(tpl); };
Actions['tpl-up']=t=>{ const tpl=S.get(App._tplId); const i=+t.dataset.i; if(i<1) return; const b=tpl.blocks.splice(i,1)[0]; tpl.blocks.splice(i-1,0,b); tplSave(tpl); renderTplEditor(true,i-1); };
Actions['tpl-dn']=t=>{ const tpl=S.get(App._tplId); const i=+t.dataset.i; if(i>=tpl.blocks.length-1) return; const b=tpl.blocks.splice(i,1)[0]; tpl.blocks.splice(i+1,0,b); tplSave(tpl); renderTplEditor(true,i+1); };

Actions['tpl-abs']=t=>{ const tpl=S.get(App._tplId); const b=tpl.blocks[+t.dataset.i]; b.abs=b.abs?0:1; tplSave(tpl); renderTplEditor(true); };

Actions['tpl-delete']=async()=>{ const tpl=S.get(App._tplId); closeSheet(); const ok=await confirmSheet('Delete “'+tpl.name+'”?','Past sessions keep their data; the template leaves the rotation.','Delete',true); if(!ok) return;

/* ── rotation editor ── */
Actions['edit-rotation']=()=>renderRotEditor();
function renderRotEditor(inPlace){ const seq=liftSeq(); const r=S.rot(); const modes=cardioModes(); const cseq=cardioSeq(); const avail=S.all('tpl').filter(t=>seq.indexOf(t.id)<0);
  (inPlace?refreshSheet:openSheet)('<div class="sheet-h"><span class="h2">Rotation</span><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +'<div class="micro mb8">Lift sequence</div>'
    +(seq.length? '<div class="card flush mb8">'+seq.map((id,i)=>'<div class="rowline"><span class="guide-num">'+(i+1)+'</span><div class="rl-main"><div class="rl-t">'+esc(S.get(id).name)+(i===r.liftIdx%seq.length?' <span class="chip brass" style="padding:1px 8px;font-size:10px">up next</span>':'')+'</div></div>'
      +'<div style="display:flex;gap:4px"><button class="iconbtn sm" data-act="rot-up" data-i="'+i+'" aria-label="Move up"'+(i<1?' disabled':'')+'>'+icon('chevu',18)+'</button><button class="iconbtn sm" data-act="rot-dn" data-i="'+i+'" aria-label="Move down"'+(i>=seq.length-1?' disabled':'')+'>'+icon('chevd',18)+'</button><button class="iconbtn sm" data-act="rot-rm" data-i="'+i+'">'+icon('x',14)+'</button></div></div>').join('')+'</div>'
      : '<div class="empty" style="padding:16px">Rotation off. Train lets you pick any template each time.</div>')
    +(avail.length? '<div class="chiprow mb14">'+avail.map(t=>'<button class="chip" data-act="rot-add" data-id="'+t.id+'">+ '+esc(t.name)+'</button>').join('')+'</div>':'')
    +'<div class="micro mb8 mt8">Cardio sequence <span class="dimmer" style="letter-spacing:0;text-transform:none;font-weight:500">— tap to toggle, order = tap order</span></div>'
    +'<div class="chiprow mb8">'+Object.keys(modes).map(k=>{ const i=cseq.indexOf(k); return '<button class="chip'+(i>=0?' brass':'')+'" style="min-height:38px" data-act="rot-cardio" data-k="'+k+'">'+(i>=0?(i+1)+' · ':'')+esc(modes[k].name)+'</button>'; }).join('')+'</div>'
    +'<button class="linkbtn" data-act="mode-new">'+icon('plus',14)+' Custom modality</button>'
    +'<div class="small dimmer mt14">Rotation advances when you finish the template that was up next (any other template leaves it in place). Tap a card on Train to jump.</div>'); }
Actions['rot-up']=t=>{ const seq=liftSeq(); const i=+t.dataset.i; if(i<1) return; const b=seq.splice(i,1)[0]; seq.splice(i-1,0,b); S.setRot({liftSeq:seq}); renderRotEditor(true); };
Actions['rot-dn']=t=>{ const seq=liftSeq(); const i=+t.dataset.i; if(i>=seq.length-1) return; const b=seq.splice(i,1)[0]; seq.splice(i+1,0,b); S.setRot({liftSeq:seq}); renderRotEditor(true); };
Actions['rot-rm']=t=>{ const seq=liftSeq(); seq.splice(+t.dataset.i,1); S.setRot({liftSeq:seq,liftIdx:seq.length? S.rot().liftIdx%seq.length:0}); renderRotEditor(true); };
Actions['rot-add']=t=>{ const seq=liftSeq(); seq.push(t.dataset.id); S.setRot({liftSeq:seq}); renderRotEditor(true); };
Actions['rot-cardio']=t=>{ const seq=cardioSeq(); const i=seq.indexOf(t.dataset.k); if(i>=0) seq.splice(i,1); else seq.push(t.dataset.k); S.setRot({cardioSeq:seq,cardioIdx:seq.length? S.rot().cardioIdx%seq.length:0}); renderRotEditor(true); };
Actions['mode-new']=async()=>{ const name=await promptSheet('Custom modality','Name (e.g. Assault bike)','','Add'); if(!name) return;
  addPreset(name); renderRotEditor(); };

Actions['edit-plates']=()=>{ const p=S.pref();

    +'<div class="field"><label class="micro">Bar weight (lb)</label><input class="input num" type="number" data-set="pl" data-k="barLb" value="'+p.barLb+'"></div>'
    +'<div class="field"><label class="micro">Plates in lb (comma-separated, per pair)</label><input class="input" data-set="pl" data-k="platesLb" value="'+p.platesLb.join(', ')+'"></div>'
    +'<div class="field"><label class="micro">Plates in kg</label><input class="input" data-set="pl" data-k="platesKg" value="'+p.platesKg.join(', ')+'"></div>'
    +'<div class="formgrid"><div class="field mb0"><label class="micro">Increment (lb)</label><input class="input num" type="number" data-set="pl" data-k="incLb" value="'+p.incLb+'"></div><div class="field mb0"><label class="micro">Increment (kg)</label><input class="input num" type="number" data-set="pl" data-k="incKg" value="'+p.incKg+'"></div></div>'); };
Inputs['pl']=t=>{ const k=t.dataset.k; if(k==='platesLb'||k==='platesKg'){ const arr=t.value.split(',').map(x=>parseFloat(x)).filter(x=>x>0).sort((a,b)=>b-a); if(arr.length) S.setPref({[k]:arr}); return; } const v=parseFloat(t.value); if(v>0) S.setPref({[k]:v}); };

/* ── data manager ── */
Actions['export-html']=async()=>{ closeSheet(); const how=await exportHTML(true); if(how!=='failed'&&how!=='cancel') toast('Ledger exported. Keep it somewhere safe'); };
Actions['export-json']=async()=>{ const how=await exportJSON(true); if(how!=='cancel') toast('Data exported'); };
Actions['export-csv']=()=>{ exportCSV(); toast('Two CSVs downloading'); };
Actions['import-pick']=()=>{ let inp=$('#il-file'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='.html,.json,text/html,application/json'; inp.id='il-file'; inp.style.display='none'; document.body.appendChild(inp);
    inp.addEventListener('change',async()=>{ const f=inp.files[0]; inp.value=''; if(!f) return; try{ const j=parseImportText(await f.text()); const sum=await summarizeImport(j); importPreviewSheet(j,sum,false); }catch(e){ toast(e.message||'Could not read that file','err'); } }); }
  inp.click(); };
function importPreviewSheet(j,sum,fromSeed){ const c=sum.counts;
  openSheet('<div class="sheet-h"><span class="h2">Import preview</span><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div><div class="card flush mb14">'
    +'<div class="rowline"><span class="dim">Sessions</span><b class="num">'+(c.sess||0)+'</b></div><div class="rowline"><span class="dim">Sets</span><b class="num">'+(c.set||0)+'</b></div><div class="rowline"><span class="dim">Body entries</span><b class="num">'+((c.bw||0)+(c.bf||0))+'</b></div>'
    +'<div class="rowline"><span class="dim">Range</span><b>'+esc(sum.range)+'</b></div><div class="rowline"><span class="dim">Exported</span><b>'+esc(sum.exportedAt? sum.exportedAt.slice(0,10):'—')+'</b></div>'
    +'<div class="rowline"><span class="dim">Integrity</span>'+(sum.sigOk===null?'<span class="dimmer">no checksum</span>':sum.sigOk?'<span class="chip good">checksum verified</span>':'<span class="chip warn">checksum mismatch</span>')+'</div></div>'
    +(sum.sigOk===false?'<div class="banner warn">'+icon('warn')+'<div>The file was modified after export. Import still works, but review the numbers after.</div></div>':'')
    +'<div class="small dimmer mb14">A snapshot of the current state is saved automatically before anything changes.</div>'
    +'<div class="stack"><button class="btn primary block" data-act="import-merge">Merge: newest version of each record wins</button><button class="btn block" data-act="import-replace">Replace: this device becomes the file</button></div>');
  App._importJ=j; App._importSeed=fromSeed; }
Actions['import-merge']=async()=>{ const j=App._importJ; closeSheet(); if(!j) return; await applyImport(j,'merge'); if(App._importSeed) App.seedPending=null; toast('Merged. Ledger updated'); };
Actions['import-replace']=async()=>{ const j=App._importJ; closeSheet(); if(!j) return; const ok=await confirmSheet('Replace everything?','Current data on this device is overwritten by the file (a snapshot is kept).','Replace',true);
  if(!ok) return; await applyImport(j,'replace'); if(App._importSeed) App.seedPending=null; toast('Replaced from file'); };
Actions['snapshots']=async()=>{ const list=await Storage.snapList();
  openSheet('<div class="sheet-h"><span class="h2">Snapshots</span><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +(list.length?'<div class="card flush">'+list.map(s=>'<button class="rowline" data-act="snap-restore" data-id="'+s.id+'"><div class="rl-main"><div class="rl-t">'+esc(s.label)+'</div><div class="rl-s">'+new Date(s.at).toLocaleString()+' · '+s.n+' records</div></div>'+icon('chevr',16)+'</button>').join('')+'</div>':'<div class="empty">No snapshots yet. They’re created automatically before every import.</div>')); };
Actions['snap-restore']=async t=>{ closeSheet(); const ok=await confirmSheet('Restore snapshot?','Current state is replaced by the snapshot (a fresh snapshot of now is saved first).','Restore',true); if(!ok) return;
  const snap=await Storage.snapGet(t.dataset.id); if(!snap) return toast('Snapshot unavailable','err'); try{ await applyImport(JSON.parse(snap.data),'replace'); toast('Snapshot restored'); }catch(e){ toast('Snapshot corrupt','err'); } };
Actions['wipe-all']=async()=>{ const ok=await confirmSheet('Erase everything?','All local data on this device is deleted. Export first if you want a copy. This cannot be undone from within the app.','Erase all data',true); if(!ok) return;
  await Storage.clearAll(); S.map.clear(); Caches.bust(); try{ localStorage.removeItem('il.data'); }catch(e){} App.seedPending=null; App._onb=0; S.pref(); S.rot(); ensureSeeds(); App.go('today'); toast('Wiped. Fresh ledger.'); };
Actions['dl-sw']=()=>{ download('sw.js','text/javascript',SW_SRC); toast('sw.js downloaded'); };

/* ═══════════════ IRON LEDGER · program actions: reorder · save to template · rest times · cardio presets ═══════════════ */

/* ── shared helpers ── */
function blockCopy(b){ const o={ex:b.ex,sets:clamp(parseInt(b.sets,10)||3,1,12),reps:b.reps||'8-12',rpe:b.rpe||null,rest:b.rest||restFor(b)}; if(b.core) o.core=1; if(b.abs) o.abs=1; return o; }
/* A finished session's plan can miss exercises that were swapped out or removed after sets were logged; fold them back in so order and templates see everything. */
function planWithSets(sess){ const plan=(sess.plan||[]).map(b=>Object.assign({},b)); const seen={}; plan.forEach(b=>seen[b.ex]=1);
  const extra={}; setsOfSession(sess.id).forEach(x=>{ if(!seen[x.ex]){ extra[x.ex]=(extra[x.ex]||0)+1; } });
  Object.keys(extra).forEach(ex=>{ const e=S.get(ex); plan.push({ex:ex,sets:extra[ex],reps:'8-12',rpe:null,rest:(e&&e.rest)||defRest()}); seen[ex]=1; });
  return plan; }
function sessionExOrder(sess){ const withSets={}; setsOfSession(sess.id).forEach(x=>withSets[x.ex]=1);
  return planWithSets(sess).map(b=>b.ex).filter((ex,i,a)=>withSets[ex]&&a.indexOf(ex)===i); }

/* ── reorder sheet (live session, history editing, finished sessions) ── */
Actions['sess-reorder']=t=>{ const id=t.dataset.id||App.route.slice(4); const s=S.get(id); if(!s) return; closeSheet();
  if(s.done){ const plan=planWithSets(s); if(plan.length!==(s.plan||[]).length) S.put({id:id,t:'sess',plan:plan},true); }
  App._ro=id; renderReorder(); };
function renderReorder(inPlace,moved){ const s=S.get(App._ro); if(!s) return closeSheet(); const plan=s.plan||[]; const n=plan.length;
  (inPlace?refreshSheet:openSheet)('<div class="sheet-h"><div><div class="micro brass">'+esc(s.name||'Session')+'</div><span class="h2">Reorder exercises</span></div><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +(n<2?'<div class="empty" style="padding:22px">Add a second exercise to reorder.</div>':'<div class="card flush">'+plan.map((b,i)=>'<div class="rowline ro-row'+(i===moved?' ro-moved':'')+'"><span class="ro-n num">'+String(i+1).padStart(2,'0')+'</span><div class="rl-main"><div class="rl-t">'+esc(exName(b.ex))+'</div><div class="rl-s">'+b.sets+' × '+esc(b.reps||'?')+' · rest '+fmtRest(restFor(b))+(s.comp&&!b.core?' · hidden in short session':'')+'</div></div>'
      +'<div class="ro-btns"><button class="iconbtn sm" data-act="ro-mv" data-i="'+i+'" data-d="-1" aria-label="Move up"'+(i<1?' disabled':'')+'>'+icon('chevu',18)+'</button><button class="iconbtn sm" data-act="ro-mv" data-i="'+i+'" data-d="1" aria-label="Move down"'+(i>=n-1?' disabled':'')+'>'+icon('chevd',18)+'</button></div></div>').join('')+'</div>')
    +'<button class="btn primary block mt14" data-act="close-sheet">Done</button>'
    +(s.tpl&&S.get(s.tpl)&&!s.done?'<div class="small dimmer center mt8">Order applies to this session. To keep it, use ⋯ → Save exercises to template.</div>':''), ()=>App.render()); }
Actions['ro-mv']=t=>{ const s=S.get(App._ro); if(!s) return; const plan=s.plan||[]; const i=+t.dataset.i, j=i+(+t.dataset.d); if(j<0||j>=plan.length) return;
  const b=plan.splice(i,1)[0]; plan.splice(j,0,b); S.put({id:s.id,t:'sess',plan:plan},true); hapt(6); renderReorder(true,j); };

/* ── save to template ── */
/* App._stp = { blocks:[...], label } : what is being saved. One block = merge into a template; many blocks from a session = replace / new. */
function tplPickerHTML(title,sub,curTpl){ const tpls=S.all('tpl').sort((a,b)=>a.name<b.name?-1:1); if(curTpl){ const i=tpls.findIndex(x=>x.id===curTpl); if(i>0) tpls.unshift(tpls.splice(i,1)[0]); }
  return '<div class="sheet-h"><div><div class="micro brass">Save to template</div><span class="h2">'+esc(title)+'</span></div><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +(sub?'<div class="small dimmer mb14">'+sub+'</div>':'')
    +'<div class="card flush">'+tpls.map(x=>{ const has=App._stp.blocks.length===1&&x.blocks.some(b=>b.ex===App._stp.blocks[0].ex);
      return '<button class="rowline" data-act="stp-pick" data-id="'+x.id+'"><span class="rowicon">'+icon(has?'check':'plus')+'</span><div class="rl-main"><div class="rl-t">'+esc(x.name)+(x.id===curTpl?' <span class="chip brass" style="padding:1px 8px;font-size:10px">this session</span>':'')+'</div><div class="rl-s">'+(has?'Already in it · update sets, reps, rest':x.blocks.length+' movement'+(x.blocks.length===1?'':'s')+' · add to the end')+'</div></div>'+icon('chevr',16)+'</button>'; }).join('')+'</div>'
    +'<button class="btn block mt14" data-act="stp-new">'+icon('plus')+' New template…</button>'; }
Actions['menu-savetpl']=t=>{ const sess=S.get(App.route.slice(4)); const b=sess&&sess.plan[+t.dataset.bi]; if(!b) return; closeSheet();
  App._stp={blocks:[blockCopy(b)],label:exName(b.ex)}; openSheet(tplPickerHTML(exName(b.ex),b.sets+' × '+esc(b.reps||'?')+(b.rpe?' @ RPE '+b.rpe:'')+' · rest '+fmtRest(restFor(b)),sess.tpl)); };
Actions['ex-savetpl']=t=>{ const ex=S.get(t.dataset.id); if(!ex) return; closeSheet();
  App._stp={blocks:[{ex:ex.id,sets:3,reps:'8-12',rpe:null,rest:ex.rest||defRest()}],label:ex.name}; openSheet(tplPickerHTML(ex.name,'Adds 3 × 8-12 · rest '+fmtRest(ex.rest||defRest())+'. Tune it in the template afterwards.',null)); };
Actions['stp-pick']=t=>{ const tpl=S.get(t.dataset.id); const st=App._stp; if(!tpl||!st) return closeSheet(); let added=0, updated=0;
  st.blocks.forEach(nb=>{ const i=tpl.blocks.findIndex(b=>b.ex===nb.ex); if(i>=0){ tpl.blocks[i]=Object.assign({},tpl.blocks[i],nb); updated++; } else { tpl.blocks.push(Object.assign({},nb)); added++; } });
  S.put({id:tpl.id,t:'tpl',blocks:tpl.blocks}); closeSheet(); hapt([8,30,8]);
  toast((added?'Added to ':'Updated in ')+tpl.name+(st.blocks.length>1?' · '+added+' added, '+updated+' updated':'')); };
Actions['stp-new']=async()=>{ const st=App._stp; if(!st) return; closeSheet(); const name=await promptSheet('New template','Name',st.tplName||'','Create'); if(!name) return;
  S.put({t:'tpl',name:name,sub:'',blocks:st.blocks.map(b=>Object.assign({},b))}); hapt([8,30,8]); toast('Template “'+name+'” saved · '+st.blocks.length+' movement'+(st.blocks.length===1?'':'s')); };
/* whole session → template */
Actions['sess-savetpl']=t=>{ const id=t.dataset.id||App.route.slice(4); const s=S.get(id); if(!s) return; closeSheet(); const plan=(s.done? planWithSets(s) : (s.plan||[]));
  if(!plan.length) return toast('No exercises to save yet','err');
  App._stp={blocks:plan.map(blockCopy),label:s.name,tplName:s.name&&s.name!=='Freestyle'? s.name:''}; const cur=s.tpl? S.get(s.tpl):null;
  openSheet('<div class="sheet-h"><div><div class="micro brass">Save to template</div><span class="h2">'+esc(s.name||'Session')+'</span></div><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +'<div class="stack mb14">'
    +(cur&&!cur.del?'<button class="btn primary block" data-act="stp-replace" data-id="'+cur.id+'">'+icon('savetpl')+' Update “'+esc(cur.name)+'” to match</button>':'')
    +'<button class="btn'+(cur?'':' primary')+' block" data-act="stp-new">'+icon('plus')+' Save as new template…</button>'
    +'<button class="btn ghost block" data-act="stp-other">Add these to another template…</button></div>'
    +'<div class="sectlabel"><span class="micro">What gets saved · '+plan.length+' exercise'+(plan.length===1?'':'s')+', in this order</span></div>'
    +'<div class="card flush">'+plan.map((b,i)=>'<div class="rowline" style="min-height:44px"><span class="ro-n num">'+String(i+1).padStart(2,'0')+'</span><div class="rl-main"><div class="rl-t">'+esc(exName(b.ex))+'</div><div class="rl-s">'+b.sets+' × '+esc(b.reps||'?')+(b.rpe?' @ RPE '+b.rpe:'')+' · rest '+fmtRest(restFor(b))+'</div></div></div>').join('')+'</div>'
    +'<div class="small dimmer mt8">Templates shape future sessions only. Logged history is never changed.</div>'); };
Actions['stp-replace']=async t=>{ const tpl=S.get(t.dataset.id); const st=App._stp; if(!tpl||!st) return; closeSheet();
  const ok=await confirmSheet('Update “'+tpl.name+'”?','Its movement list becomes these '+st.blocks.length+' exercises, in this order, with these sets, reps and rest. Core and finisher marks are kept for exercises already in it.','Update template');
  if(!ok) return; const keep={}; tpl.blocks.forEach(b=>keep[b.ex]=b);
  const blocks=st.blocks.map(nb=>{ const o=Object.assign({},nb); const k=keep[nb.ex]; if(k){ if(k.core) o.core=1; if(k.abs) o.abs=1; } return o; });
  S.put({id:tpl.id,t:'tpl',blocks:blocks}); hapt([8,30,8]); toast('“'+tpl.name+'” updated'); };
Actions['stp-other']=()=>{ const st=App._stp; if(!st) return; closeSheet(); openSheet(tplPickerHTML(st.label||'Session',st.blocks.length+' exercises · new ones are added to the end, existing ones are updated in place.',null)); };

/* ── rest times (System) ── */
Actions['rest-settings']=()=>{ App._restQ=''; renderRestSettings(); };
function restSettingsRows(q){ const inTpl={}; S.all('tpl').forEach(t=>t.blocks.forEach(b=>{ (inTpl[b.ex]=inTpl[b.ex]||[]); if(inTpl[b.ex].indexOf(t.name)<0) inTpl[b.ex].push(t.name); }));
  let list= q? S.all('ex').filter(e=>e.name.toLowerCase().indexOf(q)>=0) : S.all('ex').filter(e=>inTpl[e.id]);
  list=list.sort((a,b)=>a.name<b.name?-1:1).slice(0,80);
  if(!list.length) return '<div class="empty" style="padding:22px">'+(q?'No exercises match.':'No exercises in your templates yet. Search to set any exercise.')+'</div>';
  return '<div class="card flush">'+list.map(e=>{ const tr={}; S.all('tpl').forEach(t=>t.blocks.forEach(b=>{ if(b.ex===e.id) tr[b.rest||0]=1; })); const mixed=Object.keys(tr).length>1;
    return '<div class="rowline"><div class="rl-main"><div class="rl-t">'+esc(e.name)+'</div><div class="rl-s">'+(inTpl[e.id]? esc(inTpl[e.id].join(', ')) : 'not in a template')+(mixed?' · <span style="color:var(--warn)">mixed rest across templates</span>':'')+'</div></div>'
      +'<div class="restin"><input class="input num" type="number" inputmode="numeric" step="15" min="15" max="900" data-set="exrest" data-id="'+e.id+'" value="'+(e.rest||defRest())+'" aria-label="Rest seconds for '+esc(e.name)+'"><span class="dimmer small">s</span></div></div>'; }).join('')+'</div>'; }
function renderRestSettings(){ const p=S.pref();
  openSheet('<div class="sheet-h"><div><div class="micro brass">System</div><span class="h2">Rest times</span></div><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +'<label class="micro">Default rest</label>'+stepperHTML('rest-default',defRest(),15,'seconds')
    +'<div class="small dimmer mt8 mb14">Used by new exercises and anything without its own rest.</div>'
    +'<div class="sectlabel" style="margin-top:4px"><span class="micro">Per exercise</span></div>'
    +'<input class="input mb8" id="rest-q" placeholder="Search all exercises…" data-set="restq" data-live value="'+esc(App._restQ||'')+'">'
    +'<div id="rest-list">'+restSettingsRows(App._restQ||'')+'</div>'
    +'<div class="small dimmer mt8">Changing an exercise sets its default and updates it in every template. A session in progress keeps its own rest; change that from the rest time on the exercise.</div>', ()=>App.render());
  const d=$('#rest-default'); if(d){ d.setAttribute('data-set','restdef'); d.setAttribute('data-live',''); } }
Inputs['restdef']=t=>{ const v=Math.round(parseFloat(t.value)); if(v>=15&&v<=900) S.put(Object.assign({},S.pref(),{restDefault:v,id:'pref',t:'pref'}),true); };
Inputs['restq']=t=>{ App._restQ=t.value.trim().toLowerCase(); const el=$('#rest-list'); if(el) el.innerHTML=restSettingsRows(App._restQ); };
Inputs['exrest']=t=>{ const v=Math.round(parseFloat(t.value)); if(!(v>=15&&v<=900)) return; const id=t.dataset.id; S.put({id:id,t:'ex',rest:v},true);
  S.all('tpl').forEach(tp=>{ let hit=0; tp.blocks.forEach(b=>{ if(b.ex===id&&b.rest!==v){ b.rest=v; hit=1; } }); if(hit) S.put({id:tp.id,t:'tpl',blocks:tp.blocks},true); }); Caches.bust(); };

/* ── cardio presets ── */
function presetKey(name){ const n=name.trim().toLowerCase(); const modes=cardioModes(); const hit=Object.keys(modes).find(k=>modes[k].name.toLowerCase()===n); if(hit) return {key:hit,existing:true};
  let key='m_'+n.replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24); if(key==='m_') key='m_'+Date.now().toString(36); while(modes[key]) key+='_2'; return {key:key,existing:false}; }
function addPreset(name){ const pk=presetKey(name); if(!pk.existing){ const cm=Object.assign({},S.pref().cardioModes||{}); cm[pk.key]={name:name.trim(),icon:'pulse'}; S.setPref({cardioModes:cm}); } return pk; }
Actions['cardio-presets']=()=>renderPresets();
function renderPresets(){ const modes=cardioModes(); const custom=S.pref().cardioModes||{}; const cseq=cardioSeq();
  openSheet('<div class="sheet-h"><div><div class="micro brass">Program</div><span class="h2">Cardio presets</span></div><button class="iconbtn" data-act="close-sheet">'+icon('x')+'</button></div>'
    +'<div class="small dimmer mb14">Presets are the one-tap choices when you log cardio. Save a Custom entry as a preset from the log sheet, or add one here.</div>'
    +'<div class="card flush">'+Object.keys(modes).map(k=>{ const isC=!!custom[k]&&!DEFAULT_MODES[k];
      return '<div class="rowline"><span class="rowicon">'+icon(modes[k].icon||'pulse')+'</span><div class="rl-main"><div class="rl-t">'+esc(modes[k].name)+'</div><div class="rl-s">'+(isC?'Custom':'Built-in')+(cseq.indexOf(k)>=0?' · in rotation':'')+'</div></div>'
        +(isC?'<div class="ro-btns"><button class="iconbtn sm" data-act="preset-rename" data-k="'+k+'" aria-label="Rename">'+icon('edit',16)+'</button><button class="iconbtn sm" data-act="preset-del" data-k="'+k+'" aria-label="Delete">'+icon('trash',16)+'</button></div>':'')+'</div>'; }).join('')+'</div>'
    +'<button class="btn block mt14" data-act="preset-new">'+icon('plus')+' New preset</button>'); }
Actions['preset-new']=async()=>{ const name=await promptSheet('New cardio preset','Name (e.g. Assault bike, Ruck)','','Add'); if(name&&name.trim()){ const pk=addPreset(name); toast(pk.existing?'Already a preset':'Preset added'); } renderPresets(); };
Actions['preset-rename']=async t=>{ const k=t.dataset.k; const cm=Object.assign({},S.pref().cardioModes||{}); if(!cm[k]) return; const name=await promptSheet('Rename preset','Name',cm[k].name,'Save');
  if(name&&name.trim()){ cm[k]=Object.assign({},cm[k],{name:name.trim()}); S.setPref({cardioModes:cm}); } renderPresets(); };
Actions['preset-del']=async t=>{ const k=t.dataset.k; const cm=Object.assign({},S.pref().cardioModes||{}); if(!cm[k]) return; closeSheet();
  const ok=await confirmSheet('Delete “'+cm[k].name+'”?','Sessions you already logged keep their name and data. It leaves the cardio rotation.','Delete',true);
  if(ok){ delete cm[k]; S.setPref({cardioModes:cm}); const seq=cardioSeq().filter(x=>x!==k); S.setRot({cardioSeq:seq,cardioIdx:seq.length? S.rot().cardioIdx%seq.length:0}); toast('Preset deleted'); } renderPresets(); };
Actions['cardio-mkpreset']=t=>{ const s=S.get(t.dataset.id); if(!s||s.kind!=='cardio') return; closeSheet(); const name=(s.mods&&s.mods.custom)||s.name; if(!name) return;
  const pk=addPreset(name); S.put({id:s.id,t:'sess',mods:Object.assign({},s.mods,{mode:pk.key,custom:null})}); toast(pk.existing?'Linked to existing preset':'“'+name+'” saved as a preset'); };

</script>
